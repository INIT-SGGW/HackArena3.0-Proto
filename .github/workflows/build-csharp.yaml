name: Build C#

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Wymagane do publikacji paczek

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.122
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Clean Version
        id: ver
        run: |
          # Usuwa 'v' z początku (np. v1.0.1 -> 1.0.1) dla zgodności z NuGet
          VERSION_CLEAN=${{ inputs.version }}
          echo "clean=${VERSION_CLEAN#v}" >> $GITHUB_OUTPUT

      - name: Generate C# Code
        run: |
          buf generate --template buf.gen.csharp.yaml

      - name: Prepare Project File
        run: |
          # Kopiujemy szablon do folderu z wygenerowanym kodem
          cp templates/Proto.csproj.tmpl gen/csharp/Proto.csproj
          
          # Podmieniamy VERSION_PLACEHOLDER na faktyczną wersję
          sed -i 's/VERSION_PLACEHOLDER/${{ steps.ver.outputs.clean }}/g' gen/csharp/Proto.csproj

      - name: Pack
        run: dotnet pack gen/csharp/Proto.csproj --configuration Release

      - name: Publish to GitHub Packages
        run: dotnet nuget push "gen/csharp/bin/Release/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate