syntax = "proto3";

package race.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "HA3.Proto.Race.V1";

// Rule used to assign teams to start slots.
enum StartPlacementMode {
  START_PLACEMENT_MODE_UNSPECIFIED = 0;
  // Randomized start order when race starts.
  START_PLACEMENT_MODE_RANDOM = 1;
  // Start order follows current scoreboard (higher points first).
  START_PLACEMENT_MODE_SCOREBOARD = 2;
  // Start order follows reverse scoreboard (higher points last).
  START_PLACEMENT_MODE_REVERSED_SCOREBOARD = 3;
}

// In-game time-of-day preset used for a race.
enum TimeOfDayPreset {
  TIME_OF_DAY_PRESET_UNSPECIFIED = 0;
  TIME_OF_DAY_PRESET_MORNING = 1;
  TIME_OF_DAY_PRESET_NOON = 2;
  TIME_OF_DAY_PRESET_EVENING = 3;
  TIME_OF_DAY_PRESET_NIGHT = 4;
}

// Race configuration payload provided by frontend/admin tools.
message RaceConfigInput {
  // Human-readable race name shown in frontend.
  string race_name = 1;
  // UTC race start datetime.
  google.protobuf.Timestamp start_time_utc = 2;
  // UTC race end datetime.
  google.protobuf.Timestamp end_time_utc = 3;
  // Track/map identifier used by race simulation.
  string map_id = 4;
  // Team start placement policy.
  StartPlacementMode start_placement_mode = 5;
  // Fixed points multiplier.
  float points_multiplier_fixed = 6;
  // In-game time-of-day preset.
  TimeOfDayPreset time_of_day_preset = 7;

  reserved 8 to 19;
}

// Persisted race configuration entry with backend-assigned identifier.
message RaceConfig {
  // Stable race identifier.
  string race_id = 1;
  // User-provided race configuration fields.
  RaceConfigInput config = 2;

  reserved 3 to 19;
}

// Request for persisted race configuration schedule.
message GetRaceConfigScheduleRequest {
  reserved 1 to 19;
}

// Response with persisted race configuration schedule.
message GetRaceConfigScheduleResponse {
  // Entries should be sorted by start_time_utc ascending and have unique race_id.
  repeated RaceConfig races = 1;

  reserved 2 to 19;
}

// Full replacement of persisted race configuration schedule.
message ReplaceRaceConfigScheduleRequest {
  // Full replacement payload.
  repeated RaceConfigInput races = 1;

  reserved 2 to 19;
}

// Replacement response with persisted entries and assigned ids.
message ReplaceRaceConfigScheduleResponse {
  repeated RaceConfig races = 1;

  reserved 2 to 19;
}

// Admin API for race schedule/configuration management.
service RaceConfigAdminService {
  // Returns persisted race configuration schedule.
  rpc GetRaceConfigSchedule(GetRaceConfigScheduleRequest) returns (GetRaceConfigScheduleResponse);
  // Replaces persisted race configuration schedule.
  rpc ReplaceRaceConfigSchedule(ReplaceRaceConfigScheduleRequest) returns (ReplaceRaceConfigScheduleResponse);
}
