syntax = "proto3";

package race.v1;

option csharp_namespace = "HA3.Proto.Race.V1";

message UpdateControlsRequest {
  string car_id = 1;

  bool throttle = 2;
  bool brake = 3;

  enum Steer {
    STEER_NONE = 0;
    STEER_LEFT = 1;
    STEER_RIGHT = 2;
  }
  Steer steer = 4;
}

message UpdateControlsResponse {
  bool accepted = 1;
}

service ControlService {
  rpc UpdateControls(UpdateControlsRequest) returns (UpdateControlsResponse);
}
