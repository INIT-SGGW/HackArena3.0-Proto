syntax = "proto3";
package race.v1;

option csharp_namespace = "HA3.Proto.Race.V1";

enum MimeType {
    MIME_TYPE_UNSPECIFIED = 0;
    MIME_TYPE_GLTF_BINARY = 1;
}

message TrackMeta {
    string id = 1;
    MimeType content_type = 2;
    uint64 size_bytes = 3;
    bytes content_hash = 4;
    uint32 version = 5;
}

// Catalog entry shown in admin/frontend map pickers.
message MapCatalogEntry {
    string map_id = 1;
    string display_name = 2;
    uint32 version = 3;

    reserved 4 to 19;
}

// Request for available maps in catalog.
message ListMapsRequest {
    reserved 1 to 19;
}

// Response with maps available for race configuration.
message ListMapsResponse {
    repeated MapCatalogEntry maps = 1;

    reserved 2 to 19;
}

message GetTrackMetaRequest {
    string id = 1;
}
message GetTrackMetaResponse {
    TrackMeta meta = 1;
}

message GetTrackRequest {
    string id = 1;
    uint64 offset = 2;
    uint64 limit = 3;
    bytes if_match_hash = 4;
}
message GetTrackResponse {
    uint64 offset = 1;
    bytes data = 2;
    bool eof = 3;
}

service AssetService {
    // Returns map catalog entries used by race configuration UIs.
    rpc ListMaps(ListMapsRequest) returns (ListMapsResponse);
    rpc GetTrackMeta(GetTrackMetaRequest) returns (GetTrackMetaResponse);
    rpc GetTrack(GetTrackRequest) returns (stream GetTrackResponse);
}
