syntax = "proto3";

package race.v1;

option csharp_namespace = "HA3.Proto.Race.V1";

// 3D vector in meters.
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;

  reserved 4 to 19;
}

// Unit quaternion representing orientation.
message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;

  reserved 5 to 19;
}

// Front wheel steering angles in radians.
message WheelAngles {
  float front_left_rad = 1;
  float front_right_rad = 2;

  reserved 3 to 19;
}

// Wheel angular speeds in rotations per second.
message WheelSpeeds {
  float front_left_rps = 1;
  float front_right_rps = 2;
  float rear_left_rps = 3;
  float rear_right_rps = 4;
  
  reserved 5 to 19;
}
